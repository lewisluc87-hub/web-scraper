<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Quotes to Scrape</title></head>
<body>
<div class="quote">
    <span class="text">&ldquo;A normal quote with everything present.&rdquo;</span>
    <span>by <small class="author">Normal Author</small>
    <a href="/author/Normal-Author">(about)</a>
    </span>
    <div class="tags">
        Tags:
        <a class="tag" href="/tag/normal/">normal</a>
    </div>
</div>
<div class="quote">
    <span class="text">&ldquo;A quote with no author or tags at all.&rdquo;</span>
</div>
<div class="quote">
    <div class="tags">
        <a class="tag" href="/tag/orphan/">orphan</a>
    </div>
</div>
</body>
</html>
